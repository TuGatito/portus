# Portus — manifiesto del paquete.
#
# Es una biblioteca: se publica como biblioteca estática y se instala con
#   psc add https://github.com/TuGatito/portus --name portus --trust
# Los consumidores importan `portus` y todo el C viaja en `include/`
# (header-only), de modo que no hay nada que enlazar a mano.
[project]
name = "portus"
version = "0.1.1"
entry = "src/portus.pengu"
output = "static"

[build]
src_dir = "src"
lib_dir = "lib"
include_dir = "include"
c_dir = "c"
build_dir = "build"
strict_c99 = true
includes = []
links = []
lib_dirs = []
include_dirs = []
cflags = ["-Wall"]
ldflags = []
defines = []
cc = "gcc"

[assets]
dir = "assets"
module = "arca"
embed = false

[dependencies]

[profiles.debug]
cflags = ["-g", "-O0", "-Wall"]
defines = ["DEBUG"]

[profiles.release]
cflags = ["-O3", "-DNDEBUG", "-ffunction-sections", "-fdata-sections"]
defines = ["NDEBUG"]

[profiles.small]
cflags = ["-Os", "-DNDEBUG", "-ffunction-sections", "-fdata-sections"]
defines = ["NDEBUG", "PENGU_SIZE_OPT"]
